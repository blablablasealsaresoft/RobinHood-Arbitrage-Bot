name: Native validation
on:
  pull_request:
    branches: [sequencer-native-final]
  push:
    branches: [chatgpt/sequencer-native-local-engine]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.4.0
      - run: npm run native:validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-${{ github.sha }}
          path: validation/native/
          if-no-files-found: warn
